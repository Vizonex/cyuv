[project]
name = "cyuv"
dynamic = ["version"]
description = "A Libuv Cython Library"
readme = "README.md"

# For the authors section very important that you have a 
# business email to use if your willing to make one or disclose it.
# You don't have to (it's not a requirement) but it's encouraged.
authors = [
    { name = "Vizonex", email = "Vizonex@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

classifiers = [
    "Programming Language :: Python :: 3",
]

# Some people prefer optional-dependencies based approches
# and others may like requirements/*.txt To cut some
# size restraints for some here is a optional-dependencies approch/example.
[project.optional-dependencies]
tests = ["pytest"]

[build-system]
requires = ["setuptools", "cython", "wheel"]


[tool.setuptools.dynamic]
version = {attr = "cyuv.__version__"}


# Building wheels is extemely important in any project you make that requires compiling.
# The reason we would do so is that extensions like Visual Studio C++ are known diskspace
# eaters so some people may be lazy and may want us to compile the library for them.
# this is why packages distribute things in wheels.
[tool.cibuildwheel]
build-frontend = "build"


